<label class="kz-field">
    <span class="kz-field-label">
        {{ label() }}
        @if (required()) {
            <span class="kz-field-required">{{ REQUIRED_MARK }}</span>
        }
    </span>

    @switch (type()) {
        @case ('select') {
            <select [class]="controlClasses" [name]="name()" [value]="value()" [disabled]="disabled()"
                (change)="onInput($event)">
                @for (option of options(); track option.value) {
                    <option [value]="option.value">{{ option.label }}</option>
                }
            </select>
        }
        @case ('textarea') {
            <textarea [class]="controlClasses" [name]="name()" [rows]="rows()" [value]="value()"
                [placeholder]="placeholder()" [disabled]="disabled()" (input)="onInput($event)"></textarea>
        }
        @default {
            <div class="kz-control-wrap" [class.has-reveal]="isPassword">
                <input [class]="controlClasses" [type]="htmlType" [name]="name()" [value]="value()"
                    [placeholder]="placeholder()" [disabled]="disabled()" [attr.min]="min()" [attr.max]="max()"
                    [attr.step]="step()" (input)="onInput($event)" />

                @if (isPassword) {
                    <button type="button" class="kz-reveal" [attr.aria-label]="passwordIcon().alt"
                        [attr.aria-pressed]="passwordVisible()" [disabled]="disabled()" (click)="togglePassword()">
                        <kz-icon [img]="passwordIcon()" [size]="ICON_SIZE" [tone]="ICON_TONE" />
                    </button>
                }
            </div>
        }
    }

    @if (error().length > 0) {
        <span class="kz-field-error">{{ error() }}</span>
    }
    @else if (hint().length > 0) {
        <span class="kz-field-hint">{{ hint() }}</span>
    }
</label>
