<section class="kz-page">
    <header class="kz-page-head">
        <h1>{{ PAGE_TITLE }}</h1>
        <p>{{ PAGE_SUBTITLE }}</p>
    </header>

    <div class="toolbar">
        <kz-btn [label]="toggleFormLabel" [kind]="PRIMARY_KIND" [disabled]="isSaving" (clicked)="onToggleForm()" />

        <kz-filter-bar [fields]="filters" [loading]="isLoading" (changed)="onSearchChanged($event)"
            (reseted)="onSearchReset()" />
    </div>

    @if (errorMessage.length > 0) {
        <p class="kz-error">{{ errorMessage }}</p>
    }

    @if (isFormOpen) {
        <section class="kz-panel">
            <h2>{{ formTitle }}</h2>

            <div class="form-grid">
                <kz-field [label]="NAME_LABEL" name="name" [type]="TEXT_TYPE" [value]="form.name"
                    [error]="errors.name" [required]="true" [disabled]="isSaving" (valueChange)="onNameChange($event)" />

                <kz-field [label]="DESTINATION_LABEL" name="destination" [type]="TEXT_TYPE"
                    [value]="form.destination" [error]="errors.destination" [required]="true"
                    [disabled]="isSaving" (valueChange)="onDestinationChange($event)" />

                <kz-field [label]="DURATION_LABEL" name="durationNights" [type]="NUMBER_TYPE"
                    [value]="form.durationNights" [min]="NIGHTS_MIN" [error]="errors.durationNights"
                    [required]="true" [disabled]="isSaving" (valueChange)="onDurationChange($event)" />

                <kz-field [label]="PRICE_LABEL" name="price" [type]="NUMBER_TYPE" [value]="form.price"
                    [min]="PRICE_MIN" [step]="PRICE_STEP" [error]="errors.price" [required]="true"
                    [disabled]="isSaving" (valueChange)="onPriceChange($event)" />

                <kz-field [label]="START_DATE_LABEL" name="startDate" [type]="DATE_TYPE"
                    [value]="form.startDate" [disabled]="isSaving" (valueChange)="onStartDateChange($event)" />

                <kz-field [label]="END_DATE_LABEL" name="endDate" [type]="DATE_TYPE" [value]="form.endDate"
                    [disabled]="isSaving" (valueChange)="onEndDateChange($event)" />

                <kz-field [label]="DISCOUNT_LABEL" name="discountPercentage" [type]="NUMBER_TYPE"
                    [value]="form.discountPercentage" [min]="DISCOUNT_MIN" [max]="DISCOUNT_MAX"
                    [error]="errors.discountPercentage" [disabled]="isSaving" (valueChange)="onDiscountChange($event)" />

                <kz-field [label]="IMAGE_LABEL" name="imageUrl" [type]="TEXT_TYPE" [value]="form.imageUrl"
                    [disabled]="isSaving" (valueChange)="onImageChange($event)" />

                <kz-field [label]="DESCRIPTION_LABEL" name="description" [type]="TEXTAREA_TYPE"
                    [value]="form.description" [rows]="DESCRIPTION_ROWS" [disabled]="isSaving"
                    (valueChange)="onDescriptionChange($event)" />
            </div>

            @if (hasFormErrors) {
                <p class="kz-error">{{ VALIDATION_LABEL }}</p>
            }

            <div class="form-actions">
                <kz-btn [label]="SAVE_LABEL" [kind]="PRIMARY_KIND" [loading]="isSaving" [disabled]="isSaving"
                    (clicked)="onSubmit()" />

                <kz-btn [label]="CANCEL_LABEL" [kind]="SECONDARY_KIND" [disabled]="isSaving"
                    (clicked)="onToggleForm()" />

                <kz-btn [label]="activeLabel" [kind]="activeKind" [disabled]="isSaving" (clicked)="onToggleActive()" />
            </div>
        </section>
    }

    <kz-data-table [columns]="columns" [rows]="rows" [actions]="actions" [loading]="isLoading"
        [emptyLabel]="EMPTY_LABEL" (actionDone)="onActionDone($event)" />

    <kz-dialog [open]="isDialogOpen" [title]="DIALOG_TITLE" [message]="dialogMessage" [loading]="isDeleting"
        (confirmed)="onConfirmRemove()" (cancelled)="onCloseDialog()" />
</section>
