<section class="kz-page">
    <header class="kz-page-head">
        <h1>{{ PAGE_TITLE }}</h1>
        <p>{{ PAGE_SUBTITLE }}</p>
    </header>

    <kz-filter-bar [fields]="filters" [loading]="isLoading" (changed)="onFiltersChanged($event)"
        (submitted)="onFiltersSubmitted()" (reseted)="onFiltersReset()" />

    <kz-data-table [columns]="columns" [rows]="rows" [actions]="actions" [loading]="isLoading"
        [emptyLabel]="EMPTY_LABEL" (actionDone)="onActionDone($event)" />

    <kz-dialog [open]="isDialogOpen" [title]="dialogTitle" [message]="dialogMessage" [confirmLabel]="confirmLabel"
        [cancelLabel]="DISMISS_LABEL" [loading]="isSubmitting" (confirmed)="onConfirm()" (cancelled)="onCloseDialog()" />

    <kz-error-popup [open]="errorMessage.length > 0" [message]="errorMessage"
        (closed)="errorMessage = ''" />
</section>
