<section class="kz-page">
    <header class="kz-page-head">
        <h1>{{ PAGE_TITLE }}</h1>
        <p>{{ PAGE_SUBTITLE }}</p>
    </header>

    @if (isLoading) {
        <kz-loading [label]="LOADING_LABEL" />
    }
    @else {
        <div class="stat-grid">
            @for (stat of stats; track stat.label) {
                <kz-stat [label]="stat.label" [value]="stat.value" [hint]="stat.hint" [icon]="stat.icon"
                    [tone]="stat.tone" />
            }
        </div>

        <section class="kz-panel">
            <h2>{{ RECENT_TITLE }}</h2>

            <kz-data-table [columns]="columns" [rows]="recentRows" [emptyLabel]="EMPTY_LABEL" />
        </section>
    }

    <kz-error-popup [open]="errorMessage.length > 0" [message]="errorMessage"
        (closed)="errorMessage = ''" />
</section>
