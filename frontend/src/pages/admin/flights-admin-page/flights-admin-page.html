<section class="kz-page kz-container">
    <header class="kz-page-head">
        <h1>{{ PAGE_TITLE }}</h1>
        <p>{{ PAGE_SUBTITLE }}</p>
    </header>

    <div class="kz-row toolbar">
        <kz-btn [label]="toggleFormLabel" [kind]="PRIMARY_KIND" [disabled]="isSaving" (clicked)="onToggleForm()" />

        <kz-filter-bar [fields]="filters" [loading]="isLoading" (changed)="onSearchChanged($event)"
            (reseted)="onSearchReset()" />
    </div>

    @if (errorMessage.length > 0) {
        <p class="kz-error">{{ errorMessage }}</p>
    }

    @if (isFormOpen) {
        <section class="kz-panel">
            <h2>{{ formTitle }}</h2>

            <div class="form-grid">
                <kz-field [label]="AIRLINE_LABEL" name="airline" [type]="TEXT_TYPE" [value]="form.airline"
                    [error]="errors.airline" [required]="true" [disabled]="isSaving"
                    (valueChange)="onAirlineChange($event)" />

                <kz-field [label]="FLIGHT_NUMBER_LABEL" name="flightNumber" [type]="TEXT_TYPE"
                    [value]="form.flightNumber" [error]="errors.flightNumber" [required]="true"
                    [disabled]="isSaving" (valueChange)="onFlightNumberChange($event)" />

                <kz-field [label]="DEPARTURE_CITY_LABEL" name="departureCity" [type]="TEXT_TYPE"
                    [value]="form.departureCity" [error]="errors.departureCity" [required]="true"
                    [disabled]="isSaving" (valueChange)="onDepartureCityChange($event)" />

                <kz-field [label]="ARRIVAL_CITY_LABEL" name="arrivalCity" [type]="TEXT_TYPE"
                    [value]="form.arrivalCity" [error]="errors.arrivalCity" [required]="true"
                    [disabled]="isSaving" (valueChange)="onArrivalCityChange($event)" />

                <kz-field [label]="DEPARTURE_TIME_LABEL" name="departureTime" [type]="DATE_TYPE"
                    [value]="form.departureTime" [disabled]="isSaving" (valueChange)="onDepartureTimeChange($event)" />

                <kz-field [label]="ARRIVAL_TIME_LABEL" name="arrivalTime" [type]="DATE_TYPE"
                    [value]="form.arrivalTime" [disabled]="isSaving" (valueChange)="onArrivalTimeChange($event)" />

                <kz-field [label]="TOTAL_SEATS_LABEL" name="totalSeats" [type]="NUMBER_TYPE"
                    [value]="form.totalSeats" [min]="SEATS_MIN" [error]="errors.totalSeats" [required]="true"
                    [disabled]="isSaving" (valueChange)="onTotalSeatsChange($event)" />

                <kz-field [label]="AVAILABLE_SEATS_LABEL" name="availableSeats" [type]="NUMBER_TYPE"
                    [value]="form.availableSeats" [min]="FREE_MIN" [error]="errors.availableSeats"
                    [required]="true" [disabled]="isSaving" (valueChange)="onAvailableSeatsChange($event)" />

                <kz-field [label]="PRICE_LABEL" name="price" [type]="NUMBER_TYPE" [value]="form.price"
                    [min]="PRICE_MIN" [step]="PRICE_STEP" [error]="errors.price" [required]="true"
                    [disabled]="isSaving" (valueChange)="onPriceChange($event)" />
            </div>

            @if (hasFormErrors) {
                <p class="kz-error">{{ VALIDATION_LABEL }}</p>
            }

            <div class="kz-row">
                <kz-btn [label]="SAVE_LABEL" [kind]="PRIMARY_KIND" [loading]="isSaving" [disabled]="isSaving"
                    (clicked)="onSubmit()" />

                <kz-btn [label]="CANCEL_LABEL" [kind]="SECONDARY_KIND" [disabled]="isSaving"
                    (clicked)="onToggleForm()" />

                <kz-btn [label]="activeLabel" [kind]="activeKind" [disabled]="isSaving" (clicked)="onToggleActive()" />
            </div>
        </section>
    }

    <kz-data-table [columns]="columns" [rows]="rows" [actions]="actions" [loading]="isLoading"
        [emptyLabel]="EMPTY_LABEL" (actionDone)="onActionDone($event)" />

    <kz-dialog [open]="isDialogOpen" [title]="DIALOG_TITLE" [message]="dialogMessage" [loading]="isDeleting"
        (confirmed)="onConfirmRemove()" (cancelled)="onCloseDialog()" />
</section>
