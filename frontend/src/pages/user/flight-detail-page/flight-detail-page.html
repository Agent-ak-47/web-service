<section class="kz-page kz-container">
    @if (errorMessage.length > 0) {
        <p class="kz-error">{{ errorMessage }}</p>
    }

    @if (isLoading) {
        <kz-loading [label]="labels.loading" />
    }
    @else if (detail !== null) {
        <kz-item-detail [data]="detail" [backPath]="backPath" [backLabel]="BACK_LABEL" [quantityLabel]="QUANTITY_LABEL"
            [quantity]="quantity" [reserving]="isReserving" (quantityChanged)="onQuantityChanged($event)"
            (reserved)="onReserve()" />
    }
    @else {
        <div class="kz-empty">{{ EMPTY_LABEL }}</div>
    }
</section>
