# Static hosting of the Angular build with the SPA fallback the router needs.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Do not disclose nginx version in the Server header or error pages
    server_tokens off;

    # 2. Universal Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:8081 http://localhost:8082 http://localhost:8083 http://localhost:8084 http://localhost:8085 http://localhost:8086 http://127.0.0.1:8081 http://127.0.0.1:8082 http://127.0.0.1:8083 http://127.0.0.1:8084 http://127.0.0.1:8085 http://127.0.0.1:8086 http://host.docker.internal:8081 http://host.docker.internal:8082 http://host.docker.internal:8083 http://host.docker.internal:8084 http://host.docker.internal:8085 http://host.docker.internal:8086; connect-src 'self' http://localhost:8081 http://localhost:8082 http://localhost:8083 http://localhost:8084 http://localhost:8085 http://localhost:8086 http://127.0.0.1:8081 http://127.0.0.1:8082 http://127.0.0.1:8083 http://127.0.0.1:8084 http://127.0.0.1:8085 http://127.0.0.1:8086 http://host.docker.internal:8081 http://host.docker.internal:8082 http://host.docker.internal:8083 http://host.docker.internal:8084 http://host.docker.internal:8085 http://host.docker.internal:8086; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Deep links (/admin/..., /packages/7...) are handled by the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached for a week.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:8081 http://localhost:8082 http://localhost:8083 http://localhost:8084 http://localhost:8085 http://localhost:8086 http://127.0.0.1:8081 http://127.0.0.1:8082 http://127.0.0.1:8083 http://127.0.0.1:8084 http://127.0.0.1:8085 http://127.0.0.1:8086 http://host.docker.internal:8081 http://host.docker.internal:8082 http://host.docker.internal:8083 http://host.docker.internal:8084 http://host.docker.internal:8085 http://host.docker.internal:8086; connect-src 'self' http://localhost:8081 http://localhost:8082 http://localhost:8083 http://localhost:8084 http://localhost:8085 http://localhost:8086 http://127.0.0.1:8081 http://127.0.0.1:8082 http://127.0.0.1:8083 http://127.0.0.1:8084 http://127.0.0.1:8085 http://127.0.0.1:8086 http://host.docker.internal:8081 http://host.docker.internal:8082 http://host.docker.internal:8083 http://host.docker.internal:8084 http://host.docker.internal:8085 http://host.docker.internal:8086; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }

    # index.html must always be revalidated so a new build is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:8081 http://localhost:8082 http://localhost:8083 http://localhost:8084 http://localhost:8085 http://localhost:8086 http://127.0.0.1:8081 http://127.0.0.1:8082 http://127.0.0.1:8083 http://127.0.0.1:8084 http://127.0.0.1:8085 http://127.0.0.1:8086 http://host.docker.internal:8081 http://host.docker.internal:8082 http://host.docker.internal:8083 http://host.docker.internal:8084 http://host.docker.internal:8085 http://host.docker.internal:8086; connect-src 'self' http://localhost:8081 http://localhost:8082 http://localhost:8083 http://localhost:8084 http://localhost:8085 http://localhost:8086 http://127.0.0.1:8081 http://127.0.0.1:8082 http://127.0.0.1:8083 http://127.0.0.1:8084 http://127.0.0.1:8085 http://127.0.0.1:8086 http://host.docker.internal:8081 http://host.docker.internal:8082 http://host.docker.internal:8083 http://host.docker.internal:8084 http://host.docker.internal:8085 http://host.docker.internal:8086; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }
}
