# ---------------------------------------------------------------------------
# Online Travel Agency - complete stack.
#
#   mysql               3307  shared MySQL 8.4 database (internal port 3306)
#   phpmyadmin          8080  database administration
#   flight-service      8081  Mohammed  -> ./mohammed/backend   (Node.js)
#   package-service     8082  Youssef   -> ./package-service    (Spring Boot)
#   user-service        8083  Kamal     -> ./kamal/user          (Flask)
#   excursion-service   8084  Marwan    -> ./marwan/backend      (Node.js)
#   reservation-service 8085  Kamal     -> ./kamal/reservation   (Flask)
#   payment-service     8086  Kamal     -> ./kamal/payment       (Flask)
#   frontend            4200  shared Angular app served by Nginx -> ./frontend
#
#   docker compose up -d --build   start everything
#   docker compose ps              check the status
#   docker compose logs -f         follow the logs
#   docker compose down            stop (data is preserved)
#   docker compose down -v         FULL RESET (re-runs the db/init scripts)
#
# Values come from the root .env (cp .env.example .env).
# ---------------------------------------------------------------------------

name: travel-agency

x-app-env: &app-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${APP_DB_NAME:-travel_agency}
  DB_USER: ${APP_DB_USER:-app_user}
  DB_PASSWORD: ${APP_DB_PASSWORD:-app_pwd_2026}
  JWT_SECRET: ${JWT_SECRET:-change_me_shared_jwt_secret_at_least_32_characters}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: travel_agency_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is missing from .env}
      APP_DB_NAME: ${APP_DB_NAME:-travel_agency}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_pwd_2026}
      TZ: UTC
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - travel_agency

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: travel_agency_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is missing from .env}
      PMA_ARBITRARY: 1
    ports:
      - "${PHPMYADMIN_EXTERNAL_PORT:-8080}:80"
    networks:
      - travel_agency

  # -------------------------------------------------------------------------
  # Mohammed's Flight service (Node.js) - flights + seat movements.
  # -------------------------------------------------------------------------
  flight-service:
    build: ./mohammed/backend
    image: flight-service
    container_name: travel_agency_flight
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      - flight_uploads:/app/uploads
    networks:
      - travel_agency

  # -------------------------------------------------------------------------
  # Youssef's Package service (Spring Boot) - packages + composition.
  # -------------------------------------------------------------------------
  package-service:
    build: ./package-service
    image: package-service
    container_name: travel_agency_package
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "8082"
      FLIGHT_SERVICE_URL: http://flight-service:8081
      EXCURSION_SERVICE_URL: http://excursion-service:8084
      SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-3}
    ports:
      - "8082:8082"
    volumes:
      - package_uploads:/app/uploads
    networks:
      - travel_agency

  # -------------------------------------------------------------------------
  # Kamal's User service (Flask) - auth + profile.
  # -------------------------------------------------------------------------
  user-service:
    build: ./kamal/user
    image: kamal-user-service
    container_name: travel_agency_user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "8083"
      SECRET_KEY: ${SECRET_KEY:-change_me_flask_secret}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
    ports:
      - "8083:8083"
    networks:
      - travel_agency

  # -------------------------------------------------------------------------
  # Marwan's Excursion service (Node.js) - excursions + capacity movements.
  # -------------------------------------------------------------------------
  excursion-service:
    build: ./marwan/backend
    image: excursion-service
    container_name: travel_agency_excursion
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "8084"
    ports:
      - "8084:8084"
    volumes:
      - excursion_uploads:/app/uploads
    networks:
      - travel_agency

  # -------------------------------------------------------------------------
  # Kamal's Reservation service (Flask) - reservations + history.
  # -------------------------------------------------------------------------
  reservation-service:
    build: ./kamal/reservation
    image: kamal-reservation-service
    container_name: travel_agency_reservation
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "8085"
      SECRET_KEY: ${SECRET_KEY:-change_me_flask_secret}
      FLIGHT_SERVICE_URL: http://flight-service:8081
      PACKAGE_SERVICE_URL: http://package-service:8082
      EXCURSION_SERVICE_URL: http://excursion-service:8084
      SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-3}
      SERVICE_ATTEMPTS: ${SERVICE_ATTEMPTS:-2}
    ports:
      - "8085:8085"
    networks:
      - travel_agency

  # -------------------------------------------------------------------------
  # Kamal's Payment service (Flask) - payments + refunds.
  # -------------------------------------------------------------------------
  payment-service:
    build: ./kamal/payment
    image: kamal-payment-service
    container_name: travel_agency_payment
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "8086"
      SECRET_KEY: ${SECRET_KEY:-change_me_flask_secret}
      FLIGHT_SERVICE_URL: http://flight-service:8081
      PACKAGE_SERVICE_URL: http://package-service:8082
      EXCURSION_SERVICE_URL: http://excursion-service:8084
      SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-3}
      SERVICE_ATTEMPTS: ${SERVICE_ATTEMPTS:-2}
      DECLINED_CARD_SUFFIX: ${DECLINED_CARD_SUFFIX:-0002}
    ports:
      - "8086:8086"
    networks:
      - travel_agency

  # -------------------------------------------------------------------------
  # Angular frontend (shared app at ./frontend) served by Nginx.
  # Published on 4200 so it keeps the origin allowed by every service's CORS.
  # -------------------------------------------------------------------------
  frontend:
    build: ./frontend
    image: travel-agency-frontend
    container_name: travel_agency_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - travel_agency

volumes:
  mysql_data:
    name: travel_agency_mysql_data
  flight_uploads:
    name: travel_agency_flight_uploads
  excursion_uploads:
    name: travel_agency_excursion_uploads
  package_uploads:
    name: travel_agency_package_uploads

networks:
  travel_agency:
    name: travel_agency_net
    driver: bridge
