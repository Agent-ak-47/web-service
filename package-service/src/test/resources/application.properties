# Test configuration: replaces src/main/resources/application.properties,
# so the tests run without Docker, MySQL or the .env file.
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:package_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-jwt-secret-that-is-at-least-32-characters-long
app.cors.origins=http://localhost:4200
app.services.flight-url=http://localhost:18081
app.services.excursion-url=http://localhost:18084
app.services.timeout=1
