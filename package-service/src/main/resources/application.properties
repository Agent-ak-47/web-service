spring.application.name=package-service
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8082}

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:travel_agency}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:app_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The tables are created by db/init/*.sql and shared by the 4 services.
# Hibernate must NEVER change them, so don't use "update" here.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Shared HS256 secret: must be identical to the user service's JWT_SECRET.
app.jwt.secret=${JWT_SECRET:}

# Comma separated list of the origins allowed by CORS.
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# Other catalogue services (composition details). Timeout in seconds.
app.services.flight-url=${FLIGHT_SERVICE_URL:http://localhost:8081}
app.services.excursion-url=${EXCURSION_SERVICE_URL:http://localhost:8084}
app.services.timeout=${SERVICE_TIMEOUT:5}
