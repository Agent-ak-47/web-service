# ---------------------------------------------------------------------------
# Kamal's three Flask services + the real catalogue services of Youssef and
# Marwan (built from their own folders, their code is not modified).
#
#   user-service         8083   auth + profile
#   reservation-service  8085   reservations + history
#   payment-service      8086   payments + refunds
#   package-service      8082   Youssef   -> ../package-service
#   excursion-service    8084   Marwan    -> ../marwan/backend
#   frontend             4200   shared Angular app -> ../frontend
#
# The flight service belongs to Mohammed: while it does not exist, the
# reservation/payment services still use Kamal's flight mock on the host
# (kamal/mock/flight/index.py) through host.docker.internal:8081.
#
# The database is NOT defined here: it is the shared infrastructure at the
# repository root (docker-compose.yml, see md/06-docker-architecture.md).
# Start it first, then this stack:
#
#   docker compose up -d                                      # at the repo root
#   docker compose -f kamal/docker-compose.yml up -d --build   # all services
#
# Values (secrets, database account) come from kamal/.env:
#   cp kamal/.env.example kamal/.env
# ---------------------------------------------------------------------------

name: travel-agency-kamal

x-common: &common
  restart: unless-stopped
  # Same bridge network as the MySQL container of the root compose file.
  networks:
    - travel_agency
  # Lets the containers reach the catalogue services (the mocks) started on
  # the host machine: http://host.docker.internal:8081 etc.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &environment
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is missing from kamal/.env}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing from kamal/.env}
    DB_HOST: ${DB_HOST:-mysql}
    DB_PORT: ${DB_PORT:-3306}
    DB_NAME: ${DB_NAME:-travel_agency}
    DB_USER: ${DB_USER:-app_user}
    DB_PASSWORD: ${DB_PASSWORD:-app_pwd_2026}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

services:
  user-service:
    <<: *common
    build: ./user
    image: kamal-user-service
    environment:
      <<: *environment
      PORT: "8083"
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
    ports:
      - "8083:8083"

  reservation-service:
    <<: *common
    build: ./reservation
    image: kamal-reservation-service
    environment:
      <<: *environment
      PORT: "8085"
      FLIGHT_SERVICE_URL: ${FLIGHT_SERVICE_URL:-http://host.docker.internal:8081}
      PACKAGE_SERVICE_URL: http://package-service:8082
      EXCURSION_SERVICE_URL: http://excursion-service:8084
      SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-3}
      SERVICE_ATTEMPTS: ${SERVICE_ATTEMPTS:-2}
    ports:
      - "8085:8085"

  payment-service:
    <<: *common
    build: ./payment
    image: kamal-payment-service
    environment:
      <<: *environment
      PORT: "8086"
      FLIGHT_SERVICE_URL: ${FLIGHT_SERVICE_URL:-http://host.docker.internal:8081}
      PACKAGE_SERVICE_URL: http://package-service:8082
      EXCURSION_SERVICE_URL: http://excursion-service:8084
      SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-3}
      SERVICE_ATTEMPTS: ${SERVICE_ATTEMPTS:-2}
      DECLINED_CARD_SUFFIX: ${DECLINED_CARD_SUFFIX:-0002}
    ports:
      - "8086:8086"

  # -------------------------------------------------------------------------
  # Youssef's Package service (Spring Boot) - built from ../package-service.
  # -------------------------------------------------------------------------
  package-service:
    restart: unless-stopped
    build: ../package-service
    image: package-service
    container_name: travel_agency_package
    networks:
      - travel_agency
    # It calls the flight service (Mohammed, not available yet -> Kamal's mock)
    # running on the host, and the excursion container below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8082"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-travel_agency}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_pwd_2026}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing from kamal/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      FLIGHT_SERVICE_URL: ${FLIGHT_SERVICE_URL:-http://host.docker.internal:8081}
      EXCURSION_SERVICE_URL: http://excursion-service:8084
      SERVICE_TIMEOUT: ${SERVICE_TIMEOUT:-3}
    ports:
      - "8082:8082"

  # -------------------------------------------------------------------------
  # Marwan's Excursion service (Node.js) - built from ../marwan/backend.
  # -------------------------------------------------------------------------
  excursion-service:
    restart: unless-stopped
    build: ../marwan/backend
    image: excursion-service
    container_name: travel_agency_excursion
    networks:
      - travel_agency
    environment:
      PORT: "8084"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-travel_agency}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_pwd_2026}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing from kamal/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "8084:8084"

  # -------------------------------------------------------------------------
  # Angular frontend (shared app at ../frontend) served by Nginx.
  # Published on 4200 so it keeps the origin allowed by every service's CORS.
  # -------------------------------------------------------------------------
  frontend:
    restart: unless-stopped
    build: ../frontend
    image: travel-agency-frontend
    container_name: travel_agency_frontend
    networks:
      - travel_agency
    ports:
      - "4200:80"

networks:
  # Created by `docker compose up -d` at the repository root.
  travel_agency:
    name: travel_agency_net
    external: true
